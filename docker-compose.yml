
services:
  mysql:
    image: mysql:8.0
    container_name: docmind_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: docmind_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build: .
    container_name: docmind_backend
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql+aiomysql://root:123456@mysql:3306/docmind_db
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 43200
      DEEPSEEK_API_KEY: sk-db7858abf68f4c00bcf3f63294988679  # 替换成你的 DeepSeek API Key
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./faiss_indexes:/app/faiss_indexes
    restart: unless-stopped

volumes:
  mysql_data: